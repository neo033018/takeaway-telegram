<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#043923">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>TAKE AWAY — Thai Tea & Coffee</title>

<style>
:root {
  --green:#043923;
  --dark:#032c1b;
  --light:#0b5136;
  --gold:#d6b36a;
  --cream:#f6f0e5;
  --white:#fff;
  --muted:rgba(255,255,255,.64);
  --ease:cubic-bezier(.2,.8,.2,1);
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--white);
  background:var(--green);
  min-height:100vh;
  padding-bottom:105px;
}

button,
input,
select {
  font:inherit;
}

button {
  cursor:pointer;
}

button:disabled {
  opacity:.45;
  cursor:not-allowed;
}

button,
input,
select {
  -webkit-tap-highlight-color:transparent;
}

.hidden {
  display:none!important;
}

#app {
  max-width:560px;
  margin:auto;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header {
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(4,57,35,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(214,179,106,.15);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img {
  width:44px;
  height:44px;
  object-fit:contain;
}

.brand-name {
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--gold);
}

.brand-subtitle {
  font-size:9px;
  letter-spacing:1.6px;
  color:var(--muted);
  margin-top:3px;
}

.language-select {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(214,179,106,.3);
  border-radius:12px;
  color:white;
  padding:9px;
  outline:none;
}

.language-select option {
  background:var(--dark);
}

/* HERO */

.hero {
  padding:36px 24px 28px;
  text-align:center;
  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(214,179,106,.14),
      transparent 60%
    ),
    linear-gradient(
      160deg,
      #06452b,
      #032c1b
    );
}

.hero-logo {
  width:132px;
  height:132px;
  object-fit:contain;
  margin-bottom:15px;
  animation:float 4s ease-in-out infinite;
}

@keyframes float {
  0%,100% {
    transform:translateY(0);
  }
  50% {
    transform:translateY(-8px);
  }
}

.hero h1 {
  font-size:35px;
  letter-spacing:4px;
  margin:0;
  font-weight:900;
  color:var(--gold);
}

.hero p {
  margin:12px 0 0;
  font-size:12px;
  letter-spacing:2px;
  color:var(--muted);
}

.hero-divider {
  width:55px;
  height:2px;
  background:var(--gold);
  margin:23px auto;
}

.hero-address {
  font-size:12px;
  color:#e5e6d8;
  line-height:1.8;
}

.hero-hours {
  margin-top:12px;
  font-size:12px;
  font-weight:700;
  color:var(--gold);
}

.hero-belgrade {
  width:100%;
  max-height:125px;
  object-fit:contain;
  margin-top:20px;
  opacity:.75;
}

/* SECTIONS */

.section {
  padding:24px 17px;
}

.section-title {
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
  margin:0 0 7px;
}

.section-subtitle {
  font-size:12px;
  color:var(--muted);
  margin-bottom:22px;
}

.gold-line {
  width:42px;
  height:2px;
  background:var(--gold);
  margin-bottom:20px;
}

/* CATEGORY TABS */

.tabs {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 18px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar {
  display:none;
}

.tab {
  flex-shrink:0;
  border:1px solid rgba(214,179,106,.25);
  border-radius:100px;
  padding:11px 18px;
  background:rgba(255,255,255,.045);
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  transition:.25s;
}

.tab.active {
  background:var(--gold);
  color:var(--dark);
  border-color:var(--gold);
}

/* PRODUCT GRID */

.product-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.product-card {
  position:relative;
  min-width:0;
  border:1px solid rgba(214,179,106,.15);
  background:
    linear-gradient(
      155deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );
  border-radius:20px;
  padding:15px 12px;
  overflow:hidden;
  transition:
    transform .25s var(--ease),
    border-color .25s;
}

.product-card:active {
  transform:scale(.98);
}

.product-card:hover {
  border-color:rgba(214,179,106,.45);
}

.product-image {
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.product-name {
  font-size:13px;
  font-weight:800;
  min-height:35px;
  line-height:1.35;
}

.product-description {
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
  min-height:28px;
  line-height:1.5;
}

.product-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-top:15px;
}

.price {
  color:var(--gold);
  font-weight:900;
  font-size:16px;
  white-space:nowrap;
}

.add-button {
  border:0;
  border-radius:11px;
  background:var(--gold);
  color:var(--dark);
  font-size:21px;
  font-weight:900;
  width:36px;
  height:36px;
}

.season-label {
  position:absolute;
  top:10px;
  right:10px;
  padding:5px 7px;
  background:rgba(214,179,106,.18);
  color:var(--gold);
  border-radius:6px;
  font-size:8px;
  font-weight:800;
  letter-spacing:.5px;
}

/* DRINK ILLUSTRATIONS */

.drink {
  width:84px;
  height:115px;
  position:relative;
  filter:drop-shadow(0 12px 12px rgba(0,0,0,.25));
}

.cup {
  position:absolute;
  left:8px;
  bottom:4px;
  width:68px;
  height:94px;
  border-radius:7px 7px 15px 15px;
  border:2px solid rgba(255,255,255,.55);
  overflow:hidden;
  background:rgba(255,255,255,.08);
  transform:perspective(160px) rotateX(-4deg);
}

.liquid {
  position:absolute;
  inset:4px;
  border-radius:3px 3px 11px 11px;
  background:#a77b4f;
}

.lid {
  position:absolute;
  width:80px;
  height:8px;
  left:2px;
  top:13px;
  background:linear-gradient(#fff,#d9d9d9);
  border-radius:10px;
  z-index:3;
}

.straw {
  position:absolute;
  width:6px;
  height:34px;
  left:53px;
  top:-5px;
  border-radius:4px;
  background:rgba(255,255,255,.85);
  transform:rotate(9deg);
  z-index:2;
}

.cup.thai .liquid {
  background:linear-gradient(
    #fff0d9 0 25%,
    #df842f 25% 100%
  );
}

.cup.green .liquid {
  background:linear-gradient(
    #f1f0d8 0 26%,
    #77954c 26% 100%
  );
}

.cup.espresso .liquid {
  background:linear-gradient(
    #c48d4b 0 17%,
    #422218 17% 100%
  );
}

.cup.americano .liquid {
  background:linear-gradient(
    #7c4b32,
    #2c1c16
  );
}

.cup.cappuccino .liquid {
  background:linear-gradient(
    #f4e8d4 0 38%,
    #a66c43 38% 100%
  );
}

.cup.latte .liquid {
  background:linear-gradient(
    #f5ebdc 0 22%,
    #c18b5c 22% 55%,
    #f1e4d0 55% 100%
  );
}

.cup.flatwhite .liquid {
  background:linear-gradient(
    #f2e8d8 0 30%,
    #95633f 30% 100%
  );
}

.cup.americanocream .liquid {
  background:linear-gradient(
    #f6ebd9 0 30%,
    #38251e 30% 100%
  );
}

.cup.tonic .liquid {
  background:linear-gradient(
    #5d3826 0 30%,
    #d7bf78 30% 100%
  );
}

.cup.bumble .liquid {
  background:linear-gradient(
    #57301f 0 28%,
    #f4a12d 28% 100%
  );
}

.cup.strawberrymatcha .liquid {
  background:linear-gradient(
    #799b53 0 33%,
    #f2e7d7 33% 62%,
    #db7184 62% 100%
  );
}

.cup.matchalatte .liquid {
  background:linear-gradient(
    #779c4c 0 35%,
    #f1e7d8 35% 100%
  );
}

.cup.dirtymatcha .liquid {
  background:linear-gradient(
    #4d2a1b 0 25%,
    #73984a 25% 55%,
    #f1e8d7 55% 100%
  );
}

.cup.pumpkinlatte .liquid {
  background:linear-gradient(
    #fff0d9 0 20%,
    #b87643 20% 40%,
    #ed9c3c 40% 73%,
    #f2dfc4 73% 100%
  );
}

.cup.kuvanovino .liquid {
  background:linear-gradient(
    #a33c4a,
    #641b2b
  );
}

.cup.kuvanovino {
  border-color:rgba(255,255,255,.7);
}

/* BOTTOM NAVIGATION */

.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:560px;
  display:flex;
  background:#032b1b;
  border-top:1px solid rgba(214,179,106,.2);
  z-index:70;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
}

.nav-item {
  flex:1;
  border:0;
  background:none;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:10px;
  font-weight:700;
  padding:5px;
}

.nav-item.active {
  color:var(--gold);
}

.nav-icon {
  font-size:21px;
}

.nav-cart {
  position:relative;
}

.cart-badge {
  position:absolute;
  top:-5px;
  right:-9px;
  background:var(--gold);
  color:var(--dark);
  border-radius:100px;
  min-width:17px;
  height:17px;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* MODALS */

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal {
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow-y:auto;
  background:#07402a;
  border-radius:25px 25px 0 0;
  padding:24px 20px 35px;
  box-shadow:0 -15px 50px rgba(0,0,0,.35);
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}

.modal-title {
  font-size:21px;
  font-weight:800;
}

.close-button {
  width:35px;
  height:35px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:100px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:22px;
}

.option-title {
  font-size:12px;
  font-weight:800;
  color:var(--gold);
  margin:19px 0 10px;
}

.option-row {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.option-button {
  border:1px solid rgba(214,179,106,.3);
  background:rgba(255,255,255,.05);
  color:white;
  border-radius:12px;
  padding:11px 15px;
  font-size:12px;
}

.option-button.active {
  background:var(--gold);
  color:var(--dark);
  border-color:var(--gold);
}

.quantity-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0;
}

.quantity-controls {
  display:flex;
  align-items:center;
  gap:17px;
}

.quantity-button {
  border:1px solid rgba(214,179,106,.35);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:10px;
  width:35px;
  height:35px;
  font-size:20px;
}

.primary-button {
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:var(--gold);
  color:var(--dark);
  font-weight:900;
  font-size:14px;
}

/* CART */

.cart-item {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:17px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.cart-item-name {
  font-size:14px;
  font-weight:800;
}

.cart-item-options {
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  line-height:1.6;
}

.cart-item-price {
  color:var(--gold);
  font-weight:900;
  white-space:nowrap;
}

.remove-button {
  background:none;
  border:0;
  color:#f2a1a1;
  font-size:11px;
  margin-top:8px;
}

.cart-total {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0;
  font-size:18px;
  font-weight:900;
}

.cart-total span:last-child {
  color:var(--gold);
}

.pickup-box {
  padding:17px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(214,179,106,.15);
  border-radius:15px;
  margin-bottom:20px;
}

.pickup-box label {
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}

.pickup-box select {
  width:100%;
  background:var(--dark);
  color:white;
  border:1px solid rgba(214,179,106,.3);
  padding:13px;
  border-radius:10px;
}

.reward-box {
  border:1px solid rgba(214,179,106,.35);
  border-radius:15px;
  padding:15px;
  margin:15px 0;
  background:rgba(214,179,106,.07);
}

.reward-box label {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  line-height:1.5;
}

/* PROFILE */

.profile-card {
  border:1px solid rgba(214,179,106,.2);
  border-radius:20px;
  padding:22px;
  margin-bottom:15px;
  background:rgba(255,255,255,.05);
}

.profile-name {
  font-size:22px;
  font-weight:900;
  color:var(--gold);
}

.profile-subtitle {
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

.stamps {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:22px;
}

.stamp {
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(214,179,106,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  background:rgba(255,255,255,.04);
}

.stamp.active {
  background:var(--gold);
  color:var(--dark);
}

.stat-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(214,179,106,.15);
  border-radius:15px;
  padding:18px;
}

.stat-number {
  color:var(--gold);
  font-size:24px;
  font-weight:900;
}

.stat-label {
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

/* ORDERS */

.order-card {
  padding:17px;
  border:1px solid rgba(214,179,106,.2);
  border-radius:16px;
  margin-bottom:12px;
  background:rgba(255,255,255,.04);
}

.order-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.order-number {
  font-weight:900;
}

.order-status {
  font-size:10px;
  font-weight:800;
  color:var(--gold);
  text-transform:uppercase;
}

.order-detail {
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
}

.order-price {
  margin-top:12px;
  color:var(--gold);
  font-weight:900;
}

/* EMPTY STATE */

.empty {
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
}

.empty-icon {
  font-size:45px;
  margin-bottom:15px;
}

.empty h3 {
  color:white;
}

/* TOAST */

.toast {
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:100px;
  background:var(--gold);
  color:var(--dark);
  border-radius:12px;
  padding:12px 20px;
  z-index:200;
  font-size:12px;
  font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  max-width:90%;
  text-align:center;
}

/* FOOTER */

.footer {
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:2;
}

.footer strong {
  color:var(--gold);
}

/* RESPONSIVE */

@media(max-width:360px) {
  .product-grid {
    gap:9px;
  }

  .product-card {
    padding:12px 9px;
  }

  .product-name {
    font-size:12px;
  }

  .price {
    font-size:14px;
  }

  .hero h1 {
    font-size:29px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->

  <header class="header">
    <div class="brand">
      <img
        src="/static/logo.png"
        alt="TAKE AWAY"
        onerror="this.style.display='none'"
      >
      <div>
        <div class="brand-name">TAKE AWAY</div>
        <div class="brand-subtitle">THAI TEA & COFFEE</div>
      </div>
    </div>

    <select
      id="languageSelect"
      class="language-select"
      onchange="setLanguage(this.value)"
    >
      <option value="en">EN</option>
      <option value="sr">SR</option>
      <option value="ru">RU</option>
    </select>
  </header>

  <!-- HOME -->

  <main id="homePage">

    <section class="hero">

      <img
        class="hero-logo"
        src="/static/logo.png"
        alt="TAKE AWAY"
        onerror="this.style.display='none'"
      >

      <h1>TAKE AWAY</h1>

      <p>THAI TEA & COFFEE</p>

      <div class="hero-divider"></div>

      <div class="hero-address">
        Savski trg 1a<br>
        Belgrade, Serbia
      </div>

      <div class="hero-hours">
        OPEN DAILY · 08:00–17:00
      </div>

      <img
        class="hero-belgrade"
        src="/static/belgrade.png"
        alt="Belgrade"
        onerror="this.style.display='none'"
      >

    </section>

    <section class="section">

      <h2
        class="section-title"
        id="menuTitle"
      >
        Our Menu
      </h2>

      <div
        class="section-subtitle"
        id="menuSubtitle"
      >
        Crafted with love. Served fresh.
      </div>

      <div class="gold-line"></div>

      <div class="tabs">

        <button
          class="tab active"
          data-category="all"
          onclick="setCategory('all')"
        >
          All Drinks
        </button>

        <button
          class="tab"
          data-category="tea"
          onclick="setCategory('tea')"
        >
          Thai Tea
        </button>

        <button
          class="tab"
          data-category="coffee"
          onclick="setCategory('coffee')"
        >
          Coffee
        </button>

        <button
          class="tab"
          data-category="special"
          onclick="setCategory('special')"
        >
          Specials
        </button>

      </div>

      <div
        class="product-grid"
        id="productGrid"
      ></div>

    </section>

    <footer class="footer">
      <strong>TAKE AWAY</strong><br>
      Savski trg 1a · Belgrade<br>
      Thai Tea & Coffee<br>
      08:00–17:00
    </footer>

  </main>

  <!-- ORDERS -->

  <main
    id="ordersPage"
    class="section hidden"
  >
    <h2 class="section-title" id="ordersTitle">
      My Orders
    </h2>

    <div class="gold-line"></div>

    <div id="ordersList"></div>
  </main>

  <!-- PROFILE -->

  <main
    id="profilePage"
    class="section hidden"
  >
    <h2 class="section-title" id="profileTitle">
      My Profile
    </h2>

    <div class="gold-line"></div>

    <div id="profileContent"></div>
  </main>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    data-page="home"
    onclick="navigate('home')"
  >
    <span class="nav-icon">⌂</span>
    <span id="navHome">Home</span>
  </button>

  <button
    class="nav-item"

/* ============================================================
   HELPERS
============================================================ */

function t(key) {
  return TEXT[language]?.[key] || TEXT.en[key] || key;
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function productName(product) {
  return (
    PRODUCT_TEXT[product.id]?.[language]?.[0]
    || product.name
  );
}

function productDescription(product) {
  return (
    PRODUCT_TEXT[product.id]?.[language]?.[1]
    || ""
  );
}

function money(value) {
  return `${Math.round(value)} RSD`;
}

function showToast(message) {
  const element = document.getElementById("toast");

  element.textContent = message;
  element.classList.remove("hidden");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    element.classList.add("hidden");
  },2500);
}

function vibrate() {
  try {
    tg?.HapticFeedback?.impactOccurred("light");
  } catch(e) {}
}

async function api(path,data={}) {
  const response = await fetch(path,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      initData,
      ...data
    })
  });

  const result = await response.json();

  if (!response.ok || result.ok === false) {
    throw new Error(result.error || t("error"));
  }

  return result;
}

  language = value;

  localStorage.setItem(

  );

  document.getElementById("languageSelect").value = language;

============================================================ */

async function loadMenu() {
  try {
    const response = await fetch("/api/menu");

    if (!response.ok) {
      throw new Error("Menu unavailable");
    }

    const data = await response.json();

    menu = Array.isArray(data.menu) ? data.menu : [];

    renderMenu();

  } catch(error) {
    console.error(error);
    showToast(t("error"));
  }
}

function setCategory(value) {
  category = value;

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === value
    );
  });

  renderMenu();
  vibrate();
}

function drinkHTML(id) {
  return `
    <div class="drink">
      <div class="straw"></div>
      <div class="lid"></div>
      <div class="cup ${escapeHTML(id)}">
        <div class="liquid"></div>
      </div>
    </div>
  `;
}

function renderMenu() {
  const grid = document.getElementById("productGrid");

  const products = menu.filter(product => {
    return category === "all" || product.category === category;
  });

  grid.innerHTML = products.map(product => {
    let badge = "";

    if (product.id === "pumpkinlatte") {
      badge = '<span class="season-label">AUTUMN SPECIAL</span>';
    }

    if (product.id === "kuvanovino") {
      badge = '<span class="season-label">WINTER SPECIAL</span>';
    }

    return `
      <article class="product-card">

        ${badge}

        <div class="product-image">
          ${drinkHTML(product.id)}
        </div>

        <div class="product-name">
          ${escapeHTML(productName(product))}
        </div>

        <div class="product-description">
          ${escapeHTML(productDescription(product))}
        </div>

        <div class="product-bottom">

          <span class="price">
            ${money(product.price)}
          </span>

          <button
            class="add-button"
            onclick="openProduct('${product.id}')"
            aria-label="Add drink"
          >+</button>

        </div>

      </article>
    `;
  }).join("");
}

/* ============================================================

============================================================ */

function hasTemperature(product) {
  return !!product.temperature;
}

function canExtra(product) {
  return [
    "espresso",
    "americano",
    "cappuccino",
    "latte",
    "flatwhite",
    "americanocream",
    "tonic",
    "bumble",
    "dirtymatcha",
    "pumpkinlatte"
  ].includes(product.id);
}

function canSyrup(product) {
  return canExtra(product);
}

function icedSurcharge(product,temperature) {
  if (temperature !== "iced") return 0;

  return Number(product.iced_surcharge || 0);
}

function openProduct(id) {
  selectedProduct = menu.find(product => product.id === id);

  if (!selectedProduct) return;

  selectedTemperature = "hot";
  selectedBoba = false;
  selectedExtraShot = false;
  selectedSyrup = null;
  modalQuantity = 1;

  document.getElementById("modalProductName").textContent =
    productName(selectedProduct);

  document.getElementById("modalQuantity").textContent = "1";

  renderProductOptions();

  document.getElementById("productOverlay").classList.remove("hidden");

  vibrate();
}

function closeProduct() {
  document.getElementById("productOverlay").classList.add("hidden");
}

function closeProductOnBackdrop(event) {
  if (event.target.id === "productOverlay") {
    closeProduct();
  }
}

function optionButton(label,active,handler) {
  return `
    <button
      class="option-button ${active ? "active" : ""}"
      onclick="${handler}"
    >
      ${label}
    </button>
  `;
}

function renderProductOptions() {
  if (!selectedProduct) return;

  const product = selectedProduct;

  let html = "";

  if (hasTemperature(product)) {
    html += `
      <div class="option-title">${t("temperature")}</div>
      <div class="option-row">

        ${optionButton(
          t("hot"),
          selectedTemperature === "hot",
          "selectTemperature('hot')"
        )}

        ${optionButton(
          t("iced") +
          (product.iced_surcharge ? " +20 RSD" : ""),
          selectedTemperature === "iced",
          "selectTemperature('iced')"
        )}

      </div>
    `;
  }

  if (product.boba) {
    html += `
      <div class="option-title">${t("boba")}</div>
      <div class="option-row">

        ${optionButton(
          t("none"),
          !selectedBoba,
          "selectBoba(false)"
        )}

        ${optionButton(
          "+100 RSD",
          selectedBoba,
          "selectBoba(true)"
        )}

      </div>
    `;
  }

  if (canExtra(product)) {
    html += `
      <div class="option-title">${t("extra")}</div>
      <div class="option-row">

        ${optionButton(
          t("none"),
          !selectedExtraShot,
          "selectExtra(false)"
        )}

        ${optionButton(
          "+150 RSD",
          selectedExtraShot,
          "selectExtra(true)"
        )}

      </div>
    `;
  }

  if (canSyrup(product)) {
    html += `
      <div class="option-title">${t("syrup")} · ${t("free")}</div>
      <div class="option-row">

        ${optionButton(
          t("none"),
          !selectedSyrup,
          "selectSyrup(null)"
        )}

        ${optionButton(
          "Vanilla",
          selectedSyrup === "vanilla",
          "selectSyrup('vanilla')"
        )}

        ${optionButton(
          "Salted Caramel",
          selectedSyrup === "salted_caramel",
          "selectSyrup('salted_caramel')"
        )}

        ${optionButton(
          "Strawberry",
          selectedSyrup === "strawberry",
          "selectSyrup('strawberry')"
        )}

      </div>
    `;
  }

  document.getElementById("productOptions").innerHTML = html;

  updateModalPrice();
}

function selectTemperature(value) {
  selectedTemperature = value;
  renderProductOptions();
}

function selectBoba(value) {
  selectedBoba = value;
  renderProductOptions();
}

function selectExtra(value) {
  selectedExtraShot = value;
  renderProductOptions();
}

function selectSyrup(value) {
  selectedSyrup = value;
  renderProductOptions();
}

function changeQuantity(amount) {
  modalQuantity = Math.max(
    1,
    Math.min(10,modalQuantity + amount)
  );

  document.getElementById("modalQuantity").textContent =
    modalQuantity;

  updateModalPrice();
}

function calculateUnitPrice(item) {
  const product = menu.find(p => p.id === item.id);

  if (!product) return 0;

  let price = product.price;

  if (item.boba && product.boba) {
    price += 100;
  }

  if (item.extra_shot && canExtra(product)) {
    price += 150;
  }

  if (item.temperature === "iced") {
    price += Number(product.iced_surcharge || 0);
  }

  return price;
}

function updateModalPrice() {
  if (!selectedProduct) return;

  const item = {
    id:selectedProduct.id,
    temperature:selectedTemperature,
    boba:selectedBoba,
    extra_shot:selectedExtraShot,
    syrup:selectedSyrup
  };

  const total = calculateUnitPrice(item) * modalQuantity;

  document.getElementById("addToCartButton").textContent =
    `${t("add")} · ${money(total)}`;
}

/* ============================================================
   CART STORAGE
============================================================ */

function saveCart() {
  localStorage.setItem(
    "takeaway_cart_v2",
    JSON.stringify(cart)
  );
}

function restoreCart() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("takeaway_cart_v2") || "[]"
    );

    if (Array.isArray(saved)) {
      cart = saved.filter(item =>
        item &&
        !["lime","peanutlatte"].includes(item.id)
      );
    }

  } catch(error) {
    cart = [];
  }

  updateCartBadge();
}

function addToCart() {
  if (!selectedProduct) return;

  const item = {
    id:selectedProduct.id,
    qty:modalQuantity,
    temperature:hasTemperature(selectedProduct)
      ? selectedTemperature
      : null,
    boba:selectedBoba,
    extra_shot:selectedExtraShot,
    syrup:selectedSyrup
  };

  const signature = JSON.stringify({
    id:item.id,
    temperature:item.temperature,
    boba:item.boba,
    extra_shot:item.extra_shot,
    syrup:item.syrup
  });

  const existing = cart.find(entry =>
    JSON.stringify({
      id:entry.id,
      temperature:entry.temperature,
      boba:entry.boba,
      extra_shot:entry.extra_shot,
      syrup:entry.syrup
    }) === signature
  );

  if (existing && existing.qty + item.qty <= 10) {
    existing.qty += item.qty;
  } else {
    cart.push(item);
  }

  saveCart();
  updateCartBadge();

  closeProduct();
  showToast(t("add"));

  vibrate();
}

function updateCartBadge() {
  const count = cart.reduce(
    (sum,item) => sum + Number(item.qty || 0),
    0
  );

  const badge = document.getElementById("cartBadge");

  badge.textContent = count;
  badge.classList.toggle("hidden",count === 0);
}

function removeCartItem(index) {
  cart.splice(index,1);

  saveCart();
  updateCartBadge();
  renderCart();

  showToast(t("removed"));
}

/* ============================================================
   CART
============================================================ */

function openCart() {
  renderCart();

  document.getElementById("cartOverlay").classList.remove("hidden");

  loadRewards();
}

function closeCart() {
  document.getElementById("cartOverlay").classList.add("hidden");
}

function closeCartOnBackdrop(event) {
  if (event.target.id === "cartOverlay") {
    closeCart();
  }
}

function rewardIndex() {
  if (!document.getElementById("useReward").checked) {
    return -1;
  }

  if (rewards.rewards <= 0 || cart.length === 0) {
    return -1;
  }

  // Apply reward to the first drink.
  return 0;
}

function cartTotalValue() {
  let total = cart.reduce((sum,item) => {
    return sum + calculateUnitPrice(item) * item.qty;
  },0);

  const index = rewardIndex();

  if (index >= 0) {
    const product = menu.find(p => p.id === cart[index].id);

    if (product) {
      total -= product.price;
    }
  }

  return Math.max(0,total);
}

function renderCart() {
  const container = document.getElementById("cartItems");

  const checkout = document.getElementById("cartCheckout");

  if (!cart.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🛍</div>
        <h3>${t("empty")}</h3>
      </div>
    `;

    checkout.classList.add("hidden");
    return;
  }

  container.innerHTML = cart.map((item,index) => {
    const product = menu.find(p => p.id === item.id);

    if (!product) return "";

    const options = [];

    if (item.temperature) {
      options.push(
        item.temperature === "iced" ? t("iced") : t("hot")
      );
    }

    if (item.boba) options.push("Boba +100");
    if (item.extra_shot) options.push("Extra shot +150");
    if (item.syrup) options.push(item.syrup);

    return `
      <div class="cart-item">

        <div>
          <div class="cart-item-name">
            ${item.qty} × ${escapeHTML(productName(product))}
          </div>

          <div class="cart-item-options">
            ${escapeHTML(options.join(" · "))}
          </div>

          <button
            class="remove-button"
            onclick="removeCartItem(${index})"
          >
            ${t("remove")}
          </button>
        </div>

        <div class="cart-item-price">
          ${money(calculateUnitPrice(item) * item.qty)}
        </div>

      </div>
    `;
  }).join("");

  checkout.classList.remove("hidden");

  const rewardBox = document.getElementById("rewardBox");

  rewardBox.classList.toggle(
    "hidden",
    rewards.rewards <= 0
  );

  document.getElementById("cartTotal").textContent =
    money(cartTotalValue());

  document.getElementById("placeOrderButton").textContent =
    t("place");

  generatePickupTimes();
}

/* ============================================================
   PICKUP — 08:00 TO 17:00
============================================================ */

function belgradeParts(date=new Date()) {
  const formatter = new Intl.DateTimeFormat(
    "en-GB",
    {
      timeZone:"Europe/Belgrade",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      hourCycle:"h23"
    }
  );

  const parts = Object.fromEntries(
    formatter.formatToParts(date)
      .filter(part => part.type !== "literal")
      .map(part => [part.type,part.value])
  );

  return {
    year:Number(parts.year),
    month:Number(parts.month),
    day:Number(parts.day),
    hour:Number(parts.hour),
    minute:Number(parts.minute)
  };
}

function generatePickupTimes() {
  const select = document.getElementById("pickupTime");

  const current = belgradeParts();

  const currentMinutes = current.hour * 60 + current.minute;

  const earliest = Math.max(
    8 * 60,
    currentMinutes + 10
  );

  const roundedEarliest = Math.ceil(
    earliest / 5
  ) * 5;

  const closing = 17 * 60;

  let html = "";

  for (
    let minutes=roundedEarliest;
    minutes<=closing;
    minutes+=5
  ) {
    const hour = Math.floor(minutes / 60);
    const minute = minutes % 60;

    const label =
      String(hour).padStart(2,"0") +
      ":" +
      String(minute).padStart(2,"0");

    html += `
      <option value="${label}">
        ${label}
      </option>
    `;
  }

  if (!html) {
    html = `<option value="">${t("unavailable")}</option>`;
  }

  select.innerHTML = html;

  document.getElementById("placeOrderButton").disabled =
    !select.value || orderSubmitting;
}

/*
 Convert the selected Belgrade wall-clock time
 to an ISO timestamp with the correct UTC offset.
*/

function pickupISO() {
  const time = document.getElementById("pickupTime").value;

  if (!time) return null;

  const current = belgradeParts();

  const [hour,minute] = time.split(":").map(Number);

  const utcGuess = Date.UTC(
    current.year,
    current.month-1,
    current.day,
    hour,
    minute
  );

  const candidate = new Date(utcGuess);

  const offsetFormatter = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:"Europe/Belgrade",
      timeZoneName:"longOffset"
    }
  );

  const offsetPart = offsetFormatter.formatToParts(candidate)
    .find(part => part.type === "timeZoneName");

  const match = (offsetPart?.value || "").match(
    /GMT([+-])(\d{2}):(\d{2})/
  );

  let offsetMinutes = 0;

  if (match) {
    const sign = match[1] === "+" ? 1 : -1;

    offsetMinutes =
      sign * (
        Number(match[2])*60 +
        Number(match[3])
      );
  }

  return new Date(
    utcGuess - offsetMinutes * 60000
  ).toISOString();
}

/* ============================================================
   ORDER SUBMISSION
============================================================ */

async function placeOrder() {
  if (orderSubmitting || !cart.length) return;

  if (!initData) {
    showToast(t("login"));
    return;
  }

  const pickup = pickupISO();

  if (!pickup) {
    showToast(t("unavailable"));
    return;
  }

  orderSubmitting = true;

  const button = document.getElementById("placeOrderButton");

  button.disabled = true;
  button.textContent = "...";

  try {
    const result = await api("/api/order",{
      items:cart,
      pickup,
      payment_method:"pickup",
      reward_item_index:rewardIndex()
    });

    cart = [];
    saveCart();

    document.getElementById("useReward").checked = false;

    updateCartBadge();
    closeCart();

    showToast(
      `${t("success")} #${result.order_id}`
    );

    await loadRewards();

    navigate("orders");

  } catch(error) {
    showToast(error.message || t("error"));

  } finally {
    orderSubmitting = false;
    button.disabled = false;
    button.textContent = t("place");
  }
}

/* ============================================================
   REWARDS
============================================================ */

async function loadRewards() {
  if (!initData) return;

  try {
    const data = await api("/api/rewards");

    rewards = {
      stamps:Number(data.stamps || 0),
      rewards:Number(data.rewards || 0),
      total_drinks:Number(data.total_drinks || 0)
    };

    if (
      !document.getElementById("cartOverlay")
        .classList.contains("hidden")
    ) {
      renderCart();
    }

  } catch(error) {
    console.error(error);
  }
}

/* ============================================================
   ORDERS
============================================================ */

async function loadOrders() {
  const container = document.getElementById("ordersList");

  if (!initData) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">☕</div>
        <h3>${t("login")}</h3>
      </div>
    `;
    return;
  }

  try {
    const data = await api("/api/orders");

    if (!data.orders?.length) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">☕</div>
          <h3>${t("emptyOrders")}</h3>
        </div>
      `;
      return;
    }

    container.innerHTML = data.orders.map(order => {
      const items = Array.isArray(order.items)
        ? order.items
        : [];

      const names = items.map(item =>
        `${item.qty} × ${escapeHTML(item.name)}`
      ).join("<br>");

      return `
        <div class="order-card">

          <div class="order-top">
            <span class="order-number">
              #${order.id}
            </span>

            <span class="order-status">
              ${escapeHTML(order.status)}
            </span>
          </div>

          <div class="order-detail">
            ${names}
          </div>

          <div class="order-detail">
            ${escapeHTML(order.pickup || "")}
          </div>

          <div class="order-price">
            ${money(order.total)}
          </div>

        </div>
      `;
    }).join("");

  } catch(error) {
    container.innerHTML = `
      <div class="empty">
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

/* ============================================================
   PROFILE
============================================================ */

async function loadProfile() {
  const container = document.getElementById("profileContent");

  if (!initData) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">👤</div>
        <h3>${t("login")}</h3>
      </div>
    `;
    return;
  }

  try {
    const data = await api("/api/profile");

    const loyalty = data.rewards || rewards;

    const stamps = Number(loyalty.stamps || 0);

    const stampHTML = Array.from(
      {length:9},
      (_,index) => `
        <div class="stamp ${index < stamps ? "active" : ""}">
          ${index < stamps ? "★" : "☆"}
        </div>
      `
    ).join("");

    container.innerHTML = `
      <div class="profile-card">

        <div class="profile-name">
          ${escapeHTML(data.user?.first_name || "Customer")}
        </div>

        <div class="profile-subtitle">
          @${escapeHTML(data.user?.username || "takeaway")}
        </div>

      </div>

      <div class="profile-card">

        <strong>${t("stamps")}</strong>

        <div class="stamps">
          ${stampHTML}
        </div>

        <p class="profile-subtitle">
          Every 10th drink is free.
        </p>

      </div>

      <div class="stat-grid">

        <div class="stat">
          <div class="stat-number">
            ${loyalty.rewards || 0}
          </div>
          <div class="stat-label">
            ${t("rewards")}
          </div>
        </div>

        <div class="stat">
          <div class="stat-number">
            ${data.total_orders || 0}
          </div>
          <div class="stat-label">
            ${t("totalOrders")}
          </div>
        </div>

        <div class="stat">
          <div class="stat-number">
            ${money(data.total_spent || 0)}
          </div>

            ${t("spent")}
          </div>
        </div>

        <div class="stat">
          <div class="stat-number">
            ${loyalty.total_drinks || 0}
          </div>
          <div class="stat-label">

        </div>

  } catch(error) {
    container.innerHTML = `
      <div class="empty">
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

/* ============================================================
   NAVIGATION
============================================================ */

function navigate(page) {
  currentPage = page;

  document.getElementById("homePage")
    .classList.toggle("hidden",page !== "home");

  document.getElementById("ordersPage")
    .classList.toggle("hidden",page !== "orders");

  document.getElementById("profilePage")
    .classList.toggle("hidden",page !== "profile");

  document.querySelectorAll(".nav-item[data-page]")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.page === page
      );
    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if (page === "orders") {
    loadOrders();
  }

  if (page === "profile") {
    loadProfile();
  }

  vibrate();
}

/* ============================================================
   ANALYTICS
============================================================ */

async function recordOpen() {
  if (!initData) return;

  try {
    await api("/api/analytics/open");
  } catch(error) {
    console.log("Analytics unavailable");
  }
}

/* ============================================================
   INITIALIZATION
============================================================ */

async function initialize() {
  restoreCart();

  setLanguage(language);

  await loadMenu();

  await loadRewards();

  recordOpen();

  updateCartBadge();
}

initialize();
