<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#17231c">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>Take Away</title>

  <style>
    :root {
      --green: #17231c;
      --green2: #25362a;
      --cream: #f4f0e7;
      --card: #fffdf8;
      --muted: #7b776f;
      --line: #e5dfd3;
      --gold: #c9a86a;
      --soft: #ebe5da;
      --danger: #8b3b32;
      --success: #315a39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--cream);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: var(--cream);
      color: #171a17;

      padding-bottom: 125px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 90% 5%,
          #344a39 0,
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #18241d,
          #101711
        );

      color: white;

      padding:
        30px
        20px
        30px;

      border-radius:
        0
        0
        34px
        34px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 50%;

      right: -65px;
      bottom: -90px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 31px;
    }

    .brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;

      opacity: .72;
    }

    .status {
      display: flex;
      align-items: center;

      gap: 7px;

      padding:
        7px
        10px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.09);

      font-size: 11px;

      color:
        rgba(255,255,255,.85);
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #78d18b;

      box-shadow:
        0 0 0 3px
        rgba(120,209,139,.12);
    }

    .hero-label {
      color: #d9c18f;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.03;

      letter-spacing: -1.3px;

      max-width: 320px;

      margin-bottom: 12px;
    }

    .hero p {
      max-width: 300px;

      font-size: 14px;
      line-height: 1.5;

      color:
        rgba(255,255,255,.65);
    }


    /* =========================================
       CATEGORY
    ========================================= */

    .tabs-wrap {
      position: sticky;
      top: 0;

      z-index: 10;

      padding:
        15px
        14px
        8px;

      background:
        rgba(244,240,231,.94);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tabs {
      display: flex;

      gap: 3px;

      padding: 4px;

      border-radius: 17px;

      background: #e9e3d8;
    }

    .tab {
      flex: 1;

      border: 0;

      padding:
        10px
        7px;

      border-radius: 13px;

      background: transparent;

      color: #77736c;

      font-size: 13px;
      font-weight: 750;
    }

    .tab.active {
      background: var(--card);
      color: var(--green);

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.06);
    }


    /* =========================================
       MENU
    ========================================= */

    .section {
      padding:
        15px
        15px
        5px;
    }

    .section-head {
      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-eyebrow {
      color: #a17d43;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 1.7px;

      text-transform: uppercase;

      margin-bottom: 4px;
    }

    .section-title {
      font-size: 25px;

      letter-spacing: -.7px;
    }

    .section-count {
      color: #99958d;

      font-size: 12px;
    }

    .product {
      background: var(--card);

      border:
        1px solid
        rgba(30,40,32,.04);

      border-radius: 22px;

      padding: 17px;

      margin-bottom: 11px;

      box-shadow:
        0 7px 22px
        rgba(42,37,27,.045);
    }

    .product-top {
      display: flex;

      align-items: center;

      gap: 13px;
    }

    .drink-icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #f0ebe1;

      font-size: 22px;
    }

    .product-info {
      flex: 1;

      min-width: 0;
    }

    .product h3 {
      font-size: 16px;

      letter-spacing: -.2px;

      margin-bottom: 5px;
    }

    .price {
      color: #77736b;

      font-size: 13px;
      font-weight: 550;
    }

    .add {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      border: 0;

      border-radius: 14px;

      background: var(--green);

      color: white;

      font-size: 24px;
      font-weight: 300;

      box-shadow:
        0 5px 12px
        rgba(23,35,28,.15);
    }

    .add:active {
      transform: scale(.94);
    }

    .options {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;
    }

    .option {
      padding:
        7px
        9px;

      border:
        1px solid
        var(--line);

      border-radius: 10px;

      background: #faf7f1;

      color: #716d65;

      font-size: 11px;
      font-weight: 600;
    }


    /* =========================================
       CART ITEMS
    ========================================= */

    .cart-items {
      padding:
        8px
        15px
        0;
    }

    .cart-title {
      font-size: 19px;

      margin-bottom: 10px;
    }

    .cart-line {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding:
        12px
        13px;

      margin-bottom: 7px;

      border-radius: 16px;

      background: #e8e2d7;

      font-size: 13px;
    }

    .cart-line strong {
      font-size: 13px;
    }

    .extras-text {
      display: inline-block;

      margin-top: 3px;

      color: #77736c;

      font-size: 11px;
    }

    .cart-right {
      display: flex;

      align-items: center;

      gap: 6px;

      white-space: nowrap;

      font-weight: 650;
    }

    .remove {
      width: 29px;
      height: 29px;

      border: 0;

      border-radius: 9px;

      background:
        rgba(255,255,255,.55);

      font-size: 17px;
    }


    /* =========================================
       PICKUP
    ========================================= */

    .pickup {
      margin:
        13px
        15px
        20px;

      padding: 18px;

      border-radius: 22px;

      background: var(--card);

      box-shadow:
        0 7px 22px
        rgba(42,37,27,.04);
    }

    .pickup-top {
      display: flex;

      align-items: center;

      gap: 11px;

      margin-bottom: 16px;
    }

    .clock {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #eee8dc;

      font-size: 19px;
    }

    .pickup h2 {
      font-size: 17px;

      margin-bottom: 3px;
    }

    .pickup-description {
      color: #817d75;

      font-size: 12px;
    }


    /* ASAP / EXACT */

    .pickup-modes {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 7px;

      margin-bottom: 11px;
    }

    .pickup-mode {
      min-height: 44px;

      border:
        1px solid
        var(--line);

      border-radius: 13px;

      background: #faf8f3;

      color: #66625b;

      font-size: 13px;
      font-weight: 750;
    }

    .pickup-mode.active {
      background: var(--green);

      color: white;

      border-color: var(--green);
    }


    /* QUICK TIME */

    .times {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 7px;
    }

    .time {
      min-height: 42px;

      border:
        1px solid
        var(--line);

      border-radius: 12px;

      background: #faf8f3;

      color: #55524c;

      font-size: 12px;
      font-weight: 750;
    }

    .time.selected {
      background: var(--green);

      color: white;

      border-color: var(--green);
    }


    /* EXACT TIME */

    .exact-box {
      display: none;
    }

    .exact-box.visible {
      display: block;
    }

    .exact-label {
      display: block;

      margin-bottom: 7px;

      color: #77736c;

      font-size: 11px;
      font-weight: 650;
    }

    .exact-select {
      width: 100%;
      min-height: 49px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      padding:
        0
        14px;

      outline: none;

      background: #faf8f3;

      color: var(--green);

      font-size: 16px;
      font-weight: 700;
    }

    .pickup-info {
      margin-top: 12px;

      padding:
        10px
        11px;

      border-radius: 11px;

      background: #f1ece3;

      color: #69655e;

      font-size: 12px;
      line-height: 1.35;
    }

    .pickup-info strong {
      color: var(--green);
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .message {
      display: none;

      margin:
        12px
        15px
        20px;

      padding: 14px;

      border-radius: 16px;

      font-size: 13px;
      line-height: 1.5;

      white-space: pre-line;
    }

    .message.success {
      display: block;

      background: #e2eee1;

      color: #244b2b;
    }

    .message.error {
      display: block;

      background: #f2e3df;

      color: #77352e;
    }


    /* =========================================
       BOTTOM CART
    ========================================= */

    .bottom-cart {
      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 10px;

      z-index: 20;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding:
        11px
        12px
        11px
        17px;

      border-radius: 22px;

      background:
        rgba(22,34,27,.97);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      color: white;

      box-shadow:
        0 13px 35px
        rgba(0,0,0,.28);
    }

    .bottom-cart small {
      display: block;

      margin-bottom: 3px;

      color:
        rgba(255,255,255,.55);

      font-size: 11px;
    }

    .total {
      font-size: 20px;
      font-weight: 800;

      letter-spacing: -.3px;
    }

    .order {
      min-width: 132px;

      border: 0;

      padding:
        13px
        15px;

      border-radius: 14px;

      background: var(--cream);

      color: var(--green);

      font-size: 13px;
      font-weight: 800;
    }

    .order:active {
      transform: scale(.97);
    }

    .order:disabled {
      opacity: .55;
    }


    /* =========================================
       ADD-ON MODAL
    ========================================= */

    .modal-bg {
      position: fixed;

      inset: 0;

      z-index: 50;

      display: none;

      align-items: flex-end;

      background:
        rgba(8,12,9,.48);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal-bg.open {
      display: flex;
    }

    .modal {
      width: 100%;

      padding:
        22px
        17px
        28px;

      border-radius:
        28px
        28px
        0
        0;

      background: var(--cream);

      animation:
        slideUp
        .22s
        ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-bar {
      width: 38px;
      height: 4px;

      margin:
        -8px
        auto
        19px;

      border-radius: 10px;

      background: #cbc6bc;
    }

    .modal h2 {
      margin-bottom: 5px;

      font-size: 23px;

      letter-spacing: -.5px;
    }

    .modal-price {
      margin-bottom: 18px;

      color: var(--muted);

      font-size: 13px;
    }

    .addon {
      width: 100%;

      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;

      padding: 14px;

      border:
        1px solid
        var(--line);

      border-radius: 15px;

      background: var(--card);
    }

    .addon.selected {
      border-color: var(--green);

      background: #e7ece7;
    }

    .addon strong {
      font-size: 14px;
    }

    .addon span {
      color: #777;

      font-size: 12px;
    }

    .modal-add {
      width: 100%;

      margin-top: 11px;

      border: 0;

      border-radius: 16px;

      padding: 15px;

      background: var(--green);

      color: white;

      font-size: 15px;
      font-weight: 800;
    }


    /* =========================================
       SMALL SCREEN
    ========================================= */

    @media (max-width: 350px) {

      .hero h1 {
        font-size: 32px;
      }

      .times {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .order {
        min-width: 115px;
      }
    }
  </style>
</head>


<body>


<!-- =========================================
     HERO
========================================= -->

<div class="hero">

  <div class="brand-row">

    <div class="brand">
      TAKE AWAY
    </div>

    <div class="status">

      <span class="status-dot"></span>

      Open today

    </div>

  </div>


  <div class="hero-label">
    BELGRADE · SAVSKI TRG
  </div>


  <h1>
    Good coffee.<br>
    Ready when you are.
  </h1>


  <p>
    Order ahead and skip the wait.
    Pay when you collect.
  </p>

</div>


<!-- =========================================
     CATEGORIES
========================================= -->

<div class="tabs-wrap">

  <div class="tabs">

    <button
      class="tab active"
      onclick="showCategory('coffee', this)"
    >
      Coffee
    </button>

    <button
      class="tab"
      onclick="showCategory('tea', this)"
    >
      Thai Tea
    </button>

    <button
      class="tab"
      onclick="showCategory('special', this)"
    >
      Specials
    </button>

  </div>

</div>


<!-- MENU -->

<div id="menu"></div>


<!-- CART ITEMS -->

<div
  id="cartItems"
  class="cart-items"
></div>


<!-- =========================================
     PICKUP
========================================= -->

<div class="pickup">

  <div class="pickup-top">

    <div class="clock">
      ◷
    </div>

    <div>

      <h2>
        When do you want it?
      </h2>

      <p class="pickup-description">
        Choose when we'll have your order ready.
      </p>

    </div>

  </div>


  <!-- ASAP / EXACT -->

  <div class="pickup-modes">

    <button
      id="asapMode"
      class="pickup-mode active"
      onclick="setPickupMode('asap')"
    >
      ASAP
    </button>

    <button
      id="exactMode"
      class="pickup-mode"
      onclick="setPickupMode('exact')"
    >
      Choose time
    </button>

  </div>


  <!-- ASAP TIMES -->

  <div
    id="asapTimes"
    class="times"
  >

    <button
      class="time selected"
      onclick="chooseTime(this, 10)"
    >
      10 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this, 15)"
    >
      15 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this, 20)"
    >
      20 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this, 30)"
    >
      30 min
    </button>

  </div>


  <!-- EXACT TIME -->

  <div
    id="exactTimeBox"
    class="exact-box"
  >

    <label
      for="exactTime"
      class="exact-label"
    >
      Select pickup time
    </label>

    <select
      id="exactTime"
      class="exact-select"
      onchange="chooseExactTime()"
    >
    </select>

  </div>


  <div
    id="pickupInfo"
    class="pickup-info"
  >
    Ready in approximately
    <strong>10 minutes</strong>
  </div>

</div>


<!-- MESSAGE -->

<div
  id="message"
  class="message"
></div>


<!-- =========================================
     BOTTOM CART
========================================= -->

<div class="bottom-cart">

  <div>

    <small id="itemCount">
      0 items
    </small>

    <div
      id="total"
      class="total"
    >
      0 RSD
    </div>

  </div>


  <button
    id="orderButton"
    class="order"
    onclick="placeOrder()"
  >
    Place order →
  </button>

</div>


<!-- =========================================
     PRODUCT MODAL
========================================= -->

<div
  id="modalBg"
  class="modal-bg"
  onclick="closeModalBackground(event)"
>

  <div class="modal">

    <div class="modal-bar"></div>

    <h2 id="modalName"></h2>

    <div
      id="modalPrice"
      class="modal-price"
    ></div>


    <button
      id="extraShotOption"
      class="addon"
      onclick="toggleAddon('extra')"
    >

      <strong>
        Extra espresso shot
      </strong>

      <span>
        +150 RSD
      </span>

    </button>


    <button
      id="bobaOption"
      class="addon"
      onclick="toggleAddon('boba')"
    >

      <strong>
        Add boba
      </strong>

      <span>
        +100 RSD
      </span>

    </button>


    <button
      class="modal-add"
      onclick="confirmAdd()"
    >
      Add to order
    </button>

  </div>

</div>


<script>

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================
   STATE
========================================= */

let menu = [];

let cart = [];

let category = "coffee";


let pickupMode = "asap";

let pickupMinutes = 10;

let exactPickupDate = null;


let selectedProduct = null;

let modalExtra = false;

let modalBoba = false;


/* =========================================
   MENU
========================================= */

async function loadMenu() {

  try {

    const response =
      await fetch("/api/menu");


    if (!response.ok) {

      throw new Error(
        "Could not load menu."
      );

    }


    menu =
      await response.json();


    renderMenu();


  } catch (error) {

    showMessage(
      "Could not load the menu.",
      "error"
    );

  }
}


/* =========================================
   CATEGORY
========================================= */

function showCategory(
  cat,
  button
) {

  category = cat;


  document
    .querySelectorAll(".tab")
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  renderMenu();
}


/* =========================================
   DRINK ICON
========================================= */

function drinkIcon(product) {

  const name =
    product.name.toLowerCase();


  if (
    name.includes("tea")
  ) {

    return "🧋";

  }


  if (
    name.includes("iced") ||
    name.includes("bumble") ||
    name.includes("tonic")
  ) {

    return "🥤";

  }


  return "☕";
}


/* =========================================
   RENDER MENU
========================================= */

function renderMenu() {

  const box =
    document.getElementById(
      "menu"
    );


  const names = {

    coffee: "Coffee",

    tea: "Thai Tea",

    special: "Specials"

  };


  const products =
    menu.filter(
      x =>
        x.category === category
    );


  box.innerHTML = `

    <div class="section">

      <div class="section-head">

        <div>

          <div class="section-eyebrow">
            Made fresh
          </div>

          <h2 class="section-title">
            ${names[category]}
          </h2>

        </div>


        <div class="section-count">

          ${products.length}
          ${
            products.length === 1
            ? "drink"
            : "drinks"
          }

        </div>

      </div>


      ${products.map(p => `

        <div class="product">

          <div class="product-top">


            <div class="drink-icon">

              ${drinkIcon(p)}

            </div>


            <div class="product-info">

              <h3>
                ${p.name}
              </h3>

              <div class="price">
                ${p.price} RSD
              </div>

            </div>


            <button
              class="add"
              onclick="openProduct('${p.id}')"
            >
              +
            </button>

          </div>


          <div class="options">

            ${
              canExtraShot(p.id)
              ? `
                <span class="option">
                  Extra shot +150
                </span>
              `
              : ""
            }


            ${
              p.boba
              ? `
                <span class="option">
                  Boba +100
                </span>
              `
              : ""
            }

          </div>

        </div>

      `).join("")}

    </div>

  `;
}


/* =========================================
   EXTRAS
========================================= */

function canExtraShot(id) {

  return [
    "espresso",
    "americano",
    "cappuccino",
    "latte",
    "flatwhite",
    "icedlatte",
    "tonic",
    "bumble"
  ].includes(id);
}


/* =========================================
   PRODUCT MODAL
========================================= */

function openProduct(id) {

  selectedProduct =
    menu.find(
      x => x.id === id
    );


  if (!selectedProduct) {
    return;
  }


  modalExtra = false;

  modalBoba = false;


  document
    .getElementById(
      "modalName"
    )
    .innerText =
      selectedProduct.name;


  document
    .getElementById(
      "modalPrice"
    )
    .innerText =
      selectedProduct.price
      + " RSD";


  const extra =
    document.getElementById(
      "extraShotOption"
    );


  const boba =
    document.getElementById(
      "bobaOption"
    );


  extra.style.display =
    canExtraShot(
      selectedProduct.id
    )
      ? "flex"
      : "none";


  boba.style.display =
    selectedProduct.boba
      ? "flex"
      : "none";


  extra.classList.remove(
    "selected"
  );


  boba.classList.remove(
    "selected"
  );


  /*
    No extras available:
    add immediately.
  */

  if (
    !canExtraShot(
      selectedProduct.id
    )
    &&
    !selectedProduct.boba
  ) {

    confirmAdd();

    return;

  }


  document
    .getElementById(
      "modalBg"
    )
    .classList.add(
      "open"
    );
}


/* =========================================
   TOGGLE EXTRA
========================================= */

function toggleAddon(type) {

  if (type === "extra") {

    modalExtra =
      !modalExtra;


    document
      .getElementById(
        "extraShotOption"
      )
      .classList.toggle(
        "selected",
        modalExtra
      );

  }


  if (type === "boba") {

    modalBoba =
      !modalBoba;


    document
      .getElementById(
        "bobaOption"
      )
      .classList.toggle(
        "selected",
        modalBoba
      );

  }
}


/* =========================================
   CONFIRM ADD
========================================= */

function confirmAdd() {

  if (!selectedProduct) {
    return;
  }


  const existing =
    cart.find(
      x =>
        x.id ===
          selectedProduct.id
        &&
        x.extra_shot ===
          modalExtra
        &&
        x.boba ===
          modalBoba
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id:
        selectedProduct.id,

      qty: 1,

      extra_shot:
        modalExtra,

      boba:
        modalBoba

    });

  }


  document
    .getElementById(
      "modalBg"
    )
    .classList.remove(
      "open"
    );


  try {

    tg.HapticFeedback
      .impactOccurred(
        "light"
      );

  } catch (e) {}


  updateCart();
}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModalBackground(
  event
) {

  if (
    event.target.id ===
    "modalBg"
  ) {

    document
      .getElementById(
        "modalBg"
      )
      .classList.remove(
        "open"
      );

  }
}


/* =========================================
   PRICE
========================================= */

function itemPrice(item) {

  const product =
    menu.find(
      x =>
        x.id === item.id
    );


  if (!product) {
    return 0;
  }


  let price =
    Number(product.price);


  if (
    item.extra_shot
  ) {

    price += 150;

  }


  if (
    item.boba
  ) {

    price += 100;

  }


  return (
    price * item.qty
  );
}


/* =========================================
   CART
========================================= */

function updateCart() {

  const count =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum + item.qty,
      0
    );


  const total =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum
        + itemPrice(item),
      0
    );


  document
    .getElementById(
      "itemCount"
    )
    .innerText =
      count
      +
      (
        count === 1
          ? " item"
          : " items"
      );


  document
    .getElementById(
      "total"
    )
    .innerText =
      total
      + " RSD";


  const box =
    document.getElementById(
      "cartItems"
    );


  if (!cart.length) {

    box.innerHTML = "";

    return;

  }


  box.innerHTML = `

    <h3 class="cart-title">
      Your order
    </h3>


    ${cart.map(
      (
        item,
        index
      ) => {

        const p =
          menu.find(
            x =>
              x.id ===
              item.id
          );


        if (!p) {
          return "";
        }


        let extras = [];


        if (
          item.extra_shot
        ) {

          extras.push(
            "extra shot"
          );

        }


        if (
          item.boba
        ) {

          extras.push(
            "boba"
          );

        }


        return `

          <div class="cart-line">

            <div>

              <strong>

                ${item.qty}×
                ${p.name}

              </strong>


              ${
                extras.length
                  ? `
                    <br>

                    <span
                      class="extras-text"
                    >
                      ${extras.join(" · ")}
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="cart-right">

              ${itemPrice(item)}
              RSD


              <button
                class="remove"
                onclick="removeItem(${index})"
              >
                ×
              </button>

            </div>

          </div>

        `;

      }
    ).join("")}

  `;
}


/* =========================================
   REMOVE ITEM
========================================= */

function removeItem(index) {

  if (
    cart[index].qty > 1
  ) {

    cart[index].qty--;

  } else {

    cart.splice(
      index,
      1
    );

  }


  updateCart();
}


/* =========================================
   PICKUP MODE
========================================= */

function setPickupMode(mode) {

  pickupMode = mode;


  const asapButton =
    document.getElementById(
      "asapMode"
    );


  const exactButton =
    document.getElementById(
      "exactMode"
    );


  const asapTimes =
    document.getElementById(
      "asapTimes"
    );


  const exactBox =
    document.getElementById(
      "exactTimeBox"
    );


  if (
    mode === "asap"
  ) {

    asapButton
      .classList
      .add("active");


    exactButton
      .classList
      .remove("active");


    asapTimes.style.display =
      "grid";


    exactBox
      .classList
      .remove("visible");


    exactPickupDate = null;


    updatePickupInfo();

  } else {

    exactButton
      .classList
      .add("active");


    asapButton
      .classList
      .remove("active");


    asapTimes.style.display =
      "none";


    exactBox
      .classList
      .add("visible");


    generateExactTimes();

  }


  try {

    tg.HapticFeedback
      .selectionChanged();

  } catch (e) {}
}


/* =========================================
   ASAP TIME
========================================= */

function chooseTime(
  button,
  minutes
) {

  pickupMode = "asap";

  pickupMinutes =
    minutes;


  document
    .querySelectorAll(
      "#asapTimes .time"
    )
    .forEach(
      x =>
        x.classList.remove(
          "selected"
        )
    );


  button
    .classList
    .add("selected");


  updatePickupInfo();


  try {

    tg.HapticFeedback
      .selectionChanged();

  } catch (e) {}
}


/* =========================================
   GENERATE EXACT TIMES
========================================= */

function generateExactTimes() {

  const select =
    document.getElementById(
      "exactTime"
    );


  select.innerHTML = "";


  const now =
    new Date();


  /*
    At least 10 minutes
    preparation time.
  */

  const minimum =
    new Date(
      now.getTime()
      +
      10
      *
      60
      *
      1000
    );


  /*
    Round UP to next
    15-minute interval.

    Example:
    14:07 + 10 min = 14:17
    First available = 14:30
  */

  let first =
    new Date(minimum);


  first.setSeconds(
    0,
    0
  );


  const remainder =
    first.getMinutes()
    % 15;


  if (
    remainder !== 0
  ) {

    first.setMinutes(
      first.getMinutes()
      +
      (
        15
        -
        remainder
      )
    );

  }


  /*
    Closing time:
    17:00

    Last available slot:
    16:45
  */

  const closing =
    new Date();


  closing.setHours(
    17,
    0,
    0,
    0
  );


  /*
    If the app is somehow
    opened before 07:00,
    first pickup cannot be
    before 07:00.
  */

  const opening =
    new Date();


  opening.setHours(
    7,
    0,
    0,
    0
  );


  if (
    first < opening
  ) {

    first =
      new Date(opening);

  }


  let current =
    new Date(first);


  while (
    current < closing
  ) {

    const option =
      document.createElement(
        "option"
      );


    const hours =
      String(
        current.getHours()
      )
      .padStart(
        2,
        "0"
      );


    const minutes =
      String(
        current.getMinutes()
      )
      .padStart(
        2,
        "0"
      );


    option.value =
      current.toISOString();


    option.textContent =
      hours
      +
      ":"
      +
      minutes;


    select.appendChild(
      option
    );


    current =
      new Date(
        current.getTime()
        +
        15
        *
        60
        *
        1000
      );

  }


  if (
    !select.options.length
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value = "";


    option.textContent =
      "No pickup times available today";


    select.appendChild(
      option
    );


    exactPickupDate =
      null;

  } else {

    exactPickupDate =
      new Date(
        select.value
      );

  }


  updatePickupInfo();
}


/* =========================================
   EXACT TIME CHANGE
========================================= */

function chooseExactTime() {

  const select =
    document.getElementById(
      "exactTime"
    );


  if (
    !select.value
  ) {

    exactPickupDate =
      null;

  } else {

    exactPickupDate =
      new Date(
        select.value
      );

  }


  updatePickupInfo();


  try {

    tg.HapticFeedback
      .selectionChanged();

  } catch (e) {}
}


/* =========================================
   PICKUP INFO
========================================= */

function updatePickupInfo() {

  const info =
    document.getElementById(
      "pickupInfo"
    );


  if (!info) {
    return;
  }


  if (
    pickupMode === "asap"
  ) {

    info.innerHTML =
      "Ready in approximately "
      +
      "<strong>"
      +
      pickupMinutes
      +
      " minutes"
      +
      "</strong>";

    return;

  }


  if (
    !exactPickupDate
  ) {

    info.innerHTML =
      "<strong>"
      +
      "No pickup times available today"
      +
      "</strong>";

    return;

  }


  const hours =
    String(
      exactPickupDate
        .getHours()
    )
    .padStart(
      2,
      "0"
    );


  const minutes =
    String(
      exactPickupDate
        .getMinutes()
    )
    .padStart(
      2,
      "0"
    );


  info.innerHTML =
    "Pickup today at "
    +
    "<strong>"
    +
    hours
    +
    ":"
    +
    minutes
    +
    "</strong>";
}


/* =========================================
   PICKUP ISO FOR SERVER
========================================= */

function pickupISO() {

  if (
    pickupMode === "exact"
  ) {

    if (
      !exactPickupDate
    ) {

      return null;

    }


    return (
      exactPickupDate
        .toISOString()
    );

  }


  const date =
    new Date(
      Date.now()
      +
      pickupMinutes
      *
      60
      *
      1000
    );


  return date.toISOString();
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "error"
) {

  const el =
    document.getElementById(
      "message"
    );


  el.className =
    "message "
    +
    type;


  el.innerText =
    text;


  el.style.display =
    "block";


  el.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder() {

  if (
    !cart.length
  ) {

    showMessage(
      "Please add a drink first.",
      "error"
    );

    return;

  }


  const pickup =
    pickupISO();


  if (
    !pickup
  ) {

    showMessage(
      "Please choose a pickup time.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "orderButton"
    );


  button.disabled =
    true;


  button.innerText =
    "Sending...";


  /*
    Hide previous message
  */

  const message =
    document.getElementById(
      "message"
    );


  message.style.display =
    "none";


  try {

    const payload = {

      initData:
        tg.initData || "",

      pickup:
        pickup,

      items:
        cart

    };


    const response =
      await fetch(
        "/api/order",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    /*
      Read text first so that
      server errors don't break
      JSON parsing.
    */

    const raw =
      await response.text();


    let result = {};


    try {

      result =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (e) {

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if (
      !response.ok
    ) {

      throw new Error(
        result.error
        ||
        (
          "Order failed ("
          +
          response.status
          +
          ")."
        )
      );

    }


    /*
      SUCCESS
    */

    cart = [];


    updateCart();


    showMessage(

      "✅ Order #"
      +
      result.order_id
      +
      " confirmed!"
      +
      "\n\n"
      +
      "Pickup: "
      +
      result.pickup
      +
      "\n"
      +
      "Total: "
      +
      result.total
      +
      " RSD"
      +
      "\n\n"
      +
      "Pay when you collect. ☕",

      "success"

    );


    try {

      tg.HapticFeedback
        .notificationOccurred(
          "success"
        );

    } catch (e) {}


  } catch (error) {

    console.error(
      "Order error:",
      error
    );


    showMessage(

      "❌ "
      +
      (
        error.message
        ||
        "Could not place order."
      ),

      "error"

    );


    try {

      tg.HapticFeedback
        .notificationOccurred(
          "error"
        );

    } catch (e) {}


  } finally {

    button.disabled =
      false;


    button.innerText =
      "Place order →";

  }
}


/* =========================================
   START
========================================= */

loadMenu();

updateCart();

updatePickupInfo();

</script>
