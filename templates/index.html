<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#073b28">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>TAKE AWAY</title>

<style>

:root{
  --green:#073b28;
  --green2:#0b5136;
  --green3:#0f6543;
  --cream:#f7f2e8;
  --white:#ffffff;
  --gold:#d6b36a;
  --orange:#d85c17;
  --line:rgba(255,255,255,.15);
  --muted:rgba(255,255,255,.65);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--green);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at 100% 0%, #116342 0%, transparent 30%),
    radial-gradient(circle at 0% 40%, #0c5237 0%, transparent 35%),
    linear-gradient(180deg,#063722,#052d1e);

  color:white;

  min-height:100vh;

  padding-bottom:120px;
}

button,
select{
  font:inherit;
}


/* =====================================
   HEADER
===================================== */

.header{
  padding:
    18px
    17px
    23px;

  text-align:center;
}

.top{
  display:flex;
  justify-content:flex-end;
  margin-bottom:13px;
}


/* LANGUAGE */

.languages{
  display:flex;
  gap:5px;

  padding:4px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;

  background:rgba(0,0,0,.13);
}

.lang{
  border:0;

  padding:7px 9px;

  border-radius:11px;

  background:transparent;

  color:white;

  font-size:16px;
}

.lang.active{
  background:white;
}


/* LOGO */

.logo-icon{
  width:67px;
  height:67px;

  margin:
    0 auto
    7px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid white;
  border-radius:20px;

  font-size:35px;

  transform:rotate(-2deg);
}

.logo{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:31px;

  letter-spacing:8px;

  margin-left:8px;
}

.subtitle{
  margin-top:7px;

  font-family:
    Georgia,
    serif;

  font-size:11px;

  letter-spacing:5px;

  color:rgba(255,255,255,.75);
}

.tagline{
  margin-top:17px;

  color:var(--gold);

  font-size:10px;

  letter-spacing:3px;
}


/* =====================================
   TABS
===================================== */

.tabs-wrap{
  position:sticky;
  top:0;

  z-index:20;

  padding:
    8px
    12px
    9px;

  background:rgba(5,45,30,.92);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.tabs{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  padding:4px;

  border-radius:16px;

  background:rgba(0,0,0,.18);
}

.tab{
  min-height:42px;

  border:0;
  border-radius:12px;

  background:transparent;

  color:rgba(255,255,255,.65);

  font-size:13px;
  font-weight:700;
}

.tab.active{
  background:white;
  color:var(--green);
}


/* =====================================
   MENU
===================================== */

.section{
  padding:
    18px
    13px
    5px;
}

.section-header{
  display:flex;
  align-items:center;
  gap:10px;

  margin:
    0
    4px
    15px;
}

.section-icon{
  color:var(--gold);
  font-size:22px;
}

.section-title{
  font-family:
    Georgia,
    serif;

  font-size:25px;

  letter-spacing:3px;
}

.section-line{
  height:1px;

  flex:1;

  background:
    rgba(255,255,255,.28);
}


/* PRODUCT GRID */

.products{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}


/* CARD */

.product{
  position:relative;

  overflow:hidden;

  min-height:235px;

  padding:
    13px
    12px
    14px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.12);
}

.product::before{
  content:"";

  position:absolute;

  width:100px;
  height:100px;

  top:-40px;
  right:-40px;

  border-radius:50%;

  background:
    rgba(255,255,255,.035);
}


/* DRINK VISUAL */

.drink{
  position:relative;

  height:105px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:7px;
}


/* CUP */

.cup{
  position:relative;

  width:72px;
  height:88px;

  border:
    2px solid
    rgba(255,255,255,.75);

  border-radius:
    8px
    8px
    20px
    20px;

  overflow:hidden;

  box-shadow:
    0 10px 20px
    rgba(0,0,0,.18);
}

.cup::before{
  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:9px;

  background:
    rgba(255,255,255,.65);
}

.liquid{
  position:absolute;

  left:3px;
  right:3px;
  bottom:3px;

  height:72px;

  border-radius:
    4px
    4px
    15px
    15px;
}


/* COLORS */

.espresso .liquid{
  background:
    linear-gradient(
      #7b3515 0 12%,
      #24120b 12% 100%
    );
}

.americano .liquid{
  background:
    linear-gradient(
      #75401f,
      #180e09
    );
}

.milkcoffee .liquid{
  background:
    linear-gradient(
      #f4e4ca 0 28%,
      #c56c34 28% 100%
    );
}

.icedcoffee .liquid{
  background:
    linear-gradient(
      #eee0c5 0 20%,
      #7d351b 20% 100%
    );
}

.thai .liquid{
  background:
    linear-gradient(
      #f5e4c8 0 22%,
      #ef731c 22% 100%
    );
}

.greentea .liquid{
  background:
    linear-gradient(
      #f2e7c8 0 22%,
      #789537 22% 100%
    );
}

/* BLACK TEA WITH LIME */

.limetea .liquid{
  background:
    linear-gradient(
      #5b2d13,
      #24140d
    );
}

.bumble .liquid{
  background:
    linear-gradient(
      #4d2416 0 48%,
      #e98218 48% 100%
    );
}

.tonic .liquid{
  background:
    linear-gradient(
      #542a17 0 38%,
      #d9b55b 38% 55%,
      #e7e1cc 55% 100%
    );
}


/* ICE */

.ice{
  position:absolute;

  top:27px;
  left:14px;

  color:rgba(255,255,255,.7);

  font-size:22px;
  letter-spacing:-7px;
}


/* LIME */

.lime{
  position:absolute;

  width:31px;
  height:31px;

  right:-11px;
  top:15px;

  border:
    3px solid
    #b9d83f;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #e9f3a6 0 20%,
      #9fc735 21% 28%,
      #e9f3a6 29% 47%,
      #a4cb38 48%
    );

  z-index:4;
}


/* COFFEE CUP */

.coffee-cup{
  position:relative;

  width:78px;
  height:55px;

  border-radius:
    6px
    6px
    28px
    28px;

  background:white;

  box-shadow:
    0 11px 20px
    rgba(0,0,0,.2);
}

.coffee-cup::before{
  content:"";

  position:absolute;

  left:7px;
  right:7px;
  top:6px;

  height:15px;

  border-radius:50%;

  background:#512412;
}

.coffee-cup::after{
  content:"";

  position:absolute;

  right:-18px;
  top:12px;

  width:23px;
  height:25px;

  border:
    6px solid white;

  border-left:0;

  border-radius:
    0
    18px
    18px
    0;
}


/* PRODUCT TEXT */

.product-name{
  min-height:37px;

  text-align:center;

  font-family:
    Georgia,
    serif;

  font-size:15px;

  line-height:1.15;
}

.product-desc{
  min-height:30px;

  margin-top:3px;

  text-align:center;

  color:rgba(255,255,255,.58);

  font-size:10px;

  line-height:1.25;
}

.product-price{
  margin-top:8px;

  text-align:center;

  font-family:
    Georgia,
    serif;

  font-size:19px;
}

.add{
  width:100%;

  margin-top:10px;

  border:0;

  padding:
    10px
    7px;

  border-radius:12px;

  background:white;

  color:var(--green);

  font-size:12px;
  font-weight:800;
}


/* =====================================
   PICKUP
===================================== */

.pickup{
  margin:
    18px
    13px
    12px;

  padding:17px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:22px;

  background:
    rgba(255,255,255,.07);
}

.pickup h2{
  font-family:
    Georgia,
    serif;

  font-size:19px;

  margin-bottom:5px;
}

.pickup-subtitle{
  color:var(--muted);

  font-size:11px;

  margin-bottom:14px;
}

.pickup-modes{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-bottom:9px;
}

.pickup-mode,
.time{
  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:12px;

  background:
    rgba(0,0,0,.15);

  color:white;

  font-size:12px;
  font-weight:700;
}

.pickup-mode{
  height:43px;
}

.pickup-mode.active,
.time.selected{
  background:white;
  color:var(--green);
}

.times{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;
}

.time{
  height:40px;
}

.exact-box{
  display:none;
}

.exact-box.show{
  display:block;
}

.exact-select{
  width:100%;
  height:47px;

  border:0;
  border-radius:12px;

  padding:
    0
    13px;

  background:white;

  color:var(--green);

  font-weight:700;
}

.pickup-info{
  margin-top:10px;

  color:rgba(255,255,255,.7);

  font-size:11px;
}


/* =====================================
   CART
===================================== */

.cart-section{
  margin:
    12px
    13px;

  display:none;
}

.cart-section.show{
  display:block;
}

.cart-title{
  font-family:
    Georgia,
    serif;

  font-size:20px;

  margin-bottom:9px;
}

.cart-item{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:8px;

  margin-bottom:6px;

  padding:11px;

  border-radius:13px;

  background:
    rgba(255,255,255,.08);

  font-size:12px;
}

.cart-extra{
  margin-top:3px;

  color:rgba(255,255,255,.55);

  font-size:10px;
}

.remove{
  width:28px;
  height:28px;

  border:0;
  border-radius:8px;

  background:
    rgba(255,255,255,.15);

  color:white;

  font-size:17px;
}


/* =====================================
   BOTTOM
===================================== */

.bottom{
  position:fixed;

  z-index:30;

  left:9px;
  right:9px;
  bottom:9px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:
    10px
    10px
    10px
    15px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:20px;

  background:
    rgba(3,28,19,.96);

  backdrop-filter:blur(15px);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.35);
}

.bottom small{
  display:block;

  color:rgba(255,255,255,.55);

  font-size:10px;
}

.total{
  margin-top:2px;

  font-size:19px;
  font-weight:800;
}

.order{
  min-width:135px;

  border:0;

  padding:
    13px
    12px;

  border-radius:13px;

  background:white;

  color:var(--green);

  font-size:12px;
  font-weight:800;
}

.order:disabled{
  opacity:.5;
}


/* =====================================
   MODAL
===================================== */

.modal-bg{
  position:fixed;

  inset:0;

  z-index:50;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(4px);
}

.modal-bg.open{
  display:flex;
}

.modal{
  width:100%;

  padding:
    21px
    17px
    28px;

  border-radius:
    25px
    25px
    0
    0;

  background:#f6f0e5;

  color:#13291f;
}

.modal h2{
  font-family:
    Georgia,
    serif;

  font-size:23px;
}

.modal-price{
  margin:
    4px
    0
    16px;

  color:#777;
}

.addon{
  width:100%;

  display:flex;

  justify-content:space-between;

  padding:14px;

  margin-bottom:7px;

  border:
    1px solid
    #ddd4c5;

  border-radius:13px;

  background:white;

  color:#183326;
}

.addon.selected{
  border:
    2px solid
    var(--green);

  background:#e5eee8;
}

.modal-add{
  width:100%;

  margin-top:8px;

  border:0;

  padding:14px;

  border-radius:13px;

  background:var(--green);

  color:white;

  font-weight:800;
}


/* =====================================
   MESSAGE
===================================== */

.message{
  display:none;

  margin:
    12px
    13px;

  padding:13px;

  border-radius:14px;

  font-size:12px;
  line-height:1.5;

  white-space:pre-line;
}

.message.error{
  display:block;

  background:#f4ded9;
  color:#702d27;
}

.message.success{
  display:block;

  background:#dcecdc;
  color:#244c2b;
}


/* =====================================
   DESKTOP / BIG TELEGRAM
===================================== */

@media(min-width:600px){

  body{
    max-width:600px;
    margin:auto;
  }

  .bottom{
    max-width:580px;
    margin:auto;
  }

}

</style>
</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

  <div class="top">

    <div class="languages">

      <button
        id="lang-en"
        class="lang active"
        onclick="changeLanguage('en')"
      >
        🇬🇧
      </button>

      <button
        id="lang-sr"
        class="lang"
        onclick="changeLanguage('sr')"
      >
        🇷🇸
      </button>

      <button
        id="lang-ru"
        class="lang"
        onclick="changeLanguage('ru')"
      >
        🇷🇺
      </button>

    </div>

  </div>


  <div class="logo-icon">
    ☕
  </div>


  <div class="logo">
    TAKE AWAY
  </div>


  <div class="subtitle">
    THAI TEA & COFFEE
  </div>


  <div class="tagline">
    SAME GOOD ENERGY DAILY
  </div>

</header>


<!-- =====================================
     TABS
===================================== -->

<div class="tabs-wrap">

  <div class="tabs">

    <button
      id="tab-tea"
      class="tab active"
      onclick="showCategory('tea',this)"
    >
      Thai Tea
    </button>


    <button
      id="tab-coffee"
      class="tab"
      onclick="showCategory('coffee',this)"
    >
      Coffee
    </button>


    <button
      id="tab-special"
      class="tab"
      onclick="showCategory('special',this)"
    >
      Specials
    </button>

  </div>

</div>


<div id="menu"></div>


<!-- =====================================
     CART
===================================== -->

<div
  id="cartSection"
  class="cart-section"
>

  <div
    id="cartTitle"
    class="cart-title"
  >
    Your order
  </div>

  <div id="cartItems"></div>

</div>


<!-- =====================================
     PICKUP
===================================== -->

<section class="pickup">

  <h2 id="pickupTitle">
    Pickup time
  </h2>

  <div
    id="pickupSubtitle"
    class="pickup-subtitle"
  >
    When should we prepare your order?
  </div>


  <div class="pickup-modes">

    <button
      id="asapMode"
      class="pickup-mode active"
      onclick="setPickupMode('asap')"
    >
      ASAP
    </button>

    <button
      id="exactMode"
      class="pickup-mode"
      onclick="setPickupMode('exact')"
    >
      Choose time
    </button>

  </div>


  <div
    id="asapTimes"
    class="times"
  >

    <button
      class="time selected"
      onclick="chooseTime(this,10)"
    >
      10 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this,15)"
    >
      15 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this,20)"
    >
      20 min
    </button>

    <button
      class="time"
      onclick="chooseTime(this,30)"
    >
      30 min
    </button>

  </div>


  <div
    id="exactBox"
    class="exact-box"
  >

    <select
      id="exactTime"
      class="exact-select"
      onchange="chooseExactTime()"
    >
    </select>

  </div>


  <div
    id="pickupInfo"
    class="pickup-info"
  >
  </div>

</section>


<div
  id="message"
  class="message"
></div>


<!-- =====================================
     BOTTOM
===================================== -->

<div class="bottom">

  <div>

    <small id="itemCount">
      0 items
    </small>

    <div
      id="total"
      class="total"
    >
      0 RSD
    </div>

  </div>


  <button
    id="orderButton"
    class="order"
    onclick="placeOrder()"
  >
    Place order →
  </button>

</div>


<!-- =====================================
     ADDONS MODAL
===================================== -->

<div
  id="modalBg"
  class="modal-bg"
  onclick="closeModal(event)"
>

  <div class="modal">

    <h2 id="modalName"></h2>

    <div
      id="modalPrice"
      class="modal-price"
    ></div>


    <button
      id="extraOption"
      class="addon"
      onclick="toggleAddon('extra')"
    >

      <strong id="extraText">
        Extra shot
      </strong>

      <span>
        +150 RSD
      </span>

    </button>


    <button
      id="bobaOption"
      class="addon"
      onclick="toggleAddon('boba')"
    >

      <strong id="bobaText">
        Boba
      </strong>

      <span>
        +100 RSD
      </span>

    </button>


    <button
      id="modalAdd"
      class="modal-add"
      onclick="confirmAdd()"
    >
      Add to order
    </button>

  </div>

</div>

    success:"Porudžbina potvrđena!",

  ru:{

/* =====================================

===================================== */

let pickupMode = "asap";

/* =====================================
   LOAD MENU
===================================== */

async function loadMenu(){

  try{

    const response =
      await fetch("/api/menu");


    if(!response.ok){
      throw new Error();
    }


    menu =
      await response.json();


    renderMenu();


  }catch(error){

    showMessage(
      "Could not load menu.",
      "error"
    );

  }

}


/* =====================================
   CATEGORY
===================================== */

function showCategory(cat,button){

  category = cat;


  document
    .querySelectorAll(".tab")
    .forEach(
      x =>
        x.classList.remove("active")
    );


  button.classList.add("active");


  renderMenu();
}


/* =====================================
   PRODUCT TEXT
===================================== */

function productText(id){

  if(
    PRODUCT_TEXT[id]
    &&
    PRODUCT_TEXT[id][language]
  ){

    return PRODUCT_TEXT[id][language];

  }


  const p =
    menu.find(x => x.id === id);


  return [
    p ? p.name : id,
    ""
  ];
}


/* =====================================
   DRINK TYPE
===================================== */

function drinkClass(id){

  if(id === "espresso")
    return "espresso";

  if(id === "americano")
    return "americano";

  if(
    id === "cappuccino" ||
    id === "latte" ||
    id === "flatwhite"
  )
    return "milkcoffee";

  if(id === "icedlatte")
    return "icedcoffee";

  if(id === "thai")
    return "thai";

  if(id === "green")
    return "greentea";

  if(id === "lime")
    return "limetea";

  if(id === "bumble")
    return "bumble";

  if(id === "tonic")
    return "tonic";

  return "americano";
}


/* =====================================
   DRINK VISUAL
===================================== */

function drinkVisual(id){

  /*
    Hot milk coffees get
    a ceramic cup.
  */

  if(
    id === "cappuccino" ||
    id === "flatwhite"
  ){

    return `
      <div class="drink">
        <div class="coffee-cup"></div>
      </div>
    `;

  }


  const lime =
    id === "lime"
      ? `<span class="lime"></span>`
      : "";


  const ice =
    [
      "icedlatte",
      "thai",
      "green",
      "lime",
      "bumble",
      "tonic"
    ].includes(id)
      ? `<span class="ice">◇ ◇</span>`
      : "";


  return `

    <div class="drink">

      <div class="cup ${drinkClass(id)}">

        <div class="liquid"></div>

        ${ice}

        ${lime}

      </div>

    </div>

  `;
}


/* =====================================
   EXTRA SHOT
===================================== */

function canExtra(id){

  return [
    "espresso",
    "americano",
    "cappuccino",
    "latte",
    "flatwhite",
    "icedlatte",
    "tonic",
    "bumble"
  ].includes(id);
}


/* =====================================
   RENDER MENU
===================================== */

function renderMenu(){

  const filtered =
    menu.filter(
      x => x.category === category
    );


  let title =
    TEXT[language].coffeeTitle;


  let icon = "☕";


  if(category === "tea"){

    title =
      TEXT[language].teaTitle;

    icon = "🍃";

  }


  if(category === "special"){

    title =
      TEXT[language].specialTitle;

    icon = "✦";

  }


  document.getElementById(
    "menu"
  ).innerHTML = `

    <section class="section">

      <div class="section-header">

        <span class="section-icon">
          ${icon}
        </span>

        <span class="section-title">
          ${title}
        </span>

        <span class="section-line"></span>

      </div>


      <div class="products">

        ${filtered.map(p=>{

          const text =
            productText(p.id);


          return `

            <article class="product">

              ${drinkVisual(p.id)}


              <div class="product-name">
                ${text[0]}
              </div>


              <div class="product-desc">
                ${text[1]}
              </div>


              <div class="product-price">
                ${p.price} RSD
              </div>


              <button
                class="add"
                onclick="openProduct('${p.id}')"
              >
                + ${TEXT[language].add}
              </button>

            </article>

          `;

        }).join("")}

      </div>

    </section>

  `;
}


/* =====================================
   OPEN PRODUCT
===================================== */

function openProduct(id){

  selectedProduct =
    menu.find(
      x => x.id === id
    );


  if(!selectedProduct)
    return;


  modalExtra = false;
  modalBoba = false;


  const text =
    productText(id);


  document.getElementById(
    "modalName"
  ).innerText =
    text[0];


  document.getElementById(
    "modalPrice"
  ).innerText =
    selectedProduct.price
    + " RSD";


  const extra =
    document.getElementById(
      "extraOption"
    );


  const boba =
    document.getElementById(
      "bobaOption"
    );


  extra.style.display =
    canExtra(id)
      ? "flex"
      : "none";


  boba.style.display =
    selectedProduct.boba
      ? "flex"
      : "none";


  extra.classList.remove(
    "selected"
  );


  boba.classList.remove(
    "selected"
  );


  /*
    If no extras exist,
    add immediately.
  */

  if(
    !canExtra(id)
    &&
    !selectedProduct.boba
  ){

    confirmAdd();

    return;

  }


  document.getElementById(
    "modalBg"
  ).classList.add("open");
}


/* =====================================
   ADDONS
===================================== */

function toggleAddon(type){

  if(type === "extra"){

    modalExtra =
      !modalExtra;


    document.getElementById(
      "extraOption"
    ).classList.toggle(
      "selected",
      modalExtra
    );

  }


  if(type === "boba"){

    modalBoba =
      !modalBoba;


    document.getElementById(
      "bobaOption"
    ).classList.toggle(
      "selected",
      modalBoba
    );

  }

}


/* =====================================
   CONFIRM ADD
===================================== */

function confirmAdd(){

  if(!selectedProduct)
    return;


  const existing =
    cart.find(
      x =>
        x.id === selectedProduct.id
        &&
        x.extra_shot === modalExtra
        &&
        x.boba === modalBoba
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      id:
        selectedProduct.id,

      qty:1,

      extra_shot:
        modalExtra,

      boba:
        modalBoba

    });

  }


  document.getElementById(
    "modalBg"
  ).classList.remove("open");


  updateCart();


  try{

    tg.HapticFeedback
      .impactOccurred("light");

  }catch(e){}

}


/* =====================================
   CLOSE MODAL
===================================== */

function closeModal(event){

  if(
    event.target.id === "modalBg"
  ){

    document.getElementById(
      "modalBg"
    ).classList.remove("open");

  }

}


/* =====================================
   ITEM PRICE
===================================== */

function itemPrice(item){

  const product =
    menu.find(
      x => x.id === item.id
    );


  if(!product)
    return 0;


  let price =
    Number(product.price);


  if(item.extra_shot)
    price += 150;


  if(item.boba)
    price += 100;


  return price * item.qty;
}


/* =====================================
   CART
===================================== */

function updateCart(){

  const count =
    cart.reduce(
      (sum,x)=>sum+x.qty,
      0
    );


  const total =
    cart.reduce(
      (sum,x)=>
        sum+itemPrice(x),
      0
    );


  document.getElementById(
    "itemCount"
  ).innerText =

    count
    +
    " "
    +
    (
      count === 1
      ? TEXT[language].item
      : TEXT[language].items
    );


  document.getElementById(
    "total"
  ).innerText =
    total+" RSD";


  const section =
    document.getElementById(
      "cartSection"
    );


  const box =
    document.getElementById(
      "cartItems"
    );


  if(!cart.length){

    section.classList.remove(
      "show"
    );

    box.innerHTML="";

    return;

  }


  section.classList.add(
    "show"
  );


  box.innerHTML =
    cart.map(
      (item,index)=>{

        const p =
          menu.find(
            x=>x.id===item.id
          );


        if(!p)
          return "";


        const text =
          productText(item.id);


        let extras=[];


        if(item.extra_shot)
          extras.push(
            TEXT[language].extra
          );


        if(item.boba)
          extras.push(
            TEXT[language].boba
          );


        return `

          <div class="cart-item">

            <div>

              <strong>
                ${item.qty}×
                ${text[0]}
              </strong>

              ${
                extras.length
                ? `
                  <div class="cart-extra">
                    ${extras.join(" · ")}
                  </div>
                `
                : ""
              }

            </div>


            <div>

              ${itemPrice(item)}
              RSD

              <button
                class="remove"
                onclick="removeItem(${index})"
              >
                ×
              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================
   REMOVE
===================================== */

function removeItem(index){

  if(cart[index].qty>1){

    cart[index].qty--;

  }else{

    cart.splice(index,1);

  }


  updateCart();
}


/* =====================================
   PICKUP MODE
===================================== */

function setPickupMode(mode){

  pickupMode=mode;


  const asap =
    document.getElementById(
      "asapMode"
    );


  const exact =
    document.getElementById(
      "exactMode"
    );


  const times =
    document.getElementById(
      "asapTimes"
    );


  const box =
    document.getElementById(
      "exactBox"
    );


  if(mode==="asap"){

    asap.classList.add("active");

    exact.classList.remove("active");

    times.style.display="grid";

    box.classList.remove("show");

    exactPickupDate=null;

  }else{

    exact.classList.add("active");

    asap.classList.remove("active");

    times.style.display="none";

    box.classList.add("show");

    generateExactTimes();

  }


  updatePickupInfo();
}


/* =====================================
   ASAP
===================================== */

function chooseTime(button,minutes){

  pickupMode="asap";

  pickupMinutes=minutes;


  document
    .querySelectorAll(".time")
    .forEach(
      x =>
        x.classList.remove(
          "selected"
        )
    );


  button.classList.add(
    "selected"
  );


  updatePickupInfo();
}


/* =====================================
   EXACT TIMES
===================================== */

function generateExactTimes(){

  const select =
    document.getElementById(
      "exactTime"
    );


  select.innerHTML="";


  const now =
    new Date();


  let first =
    new Date(
      now.getTime()
      +
      10*60*1000
    );


  first.setSeconds(0,0);


  const remainder =
    first.getMinutes()%15;


  if(remainder!==0){

    first.setMinutes(
      first.getMinutes()
      +
      (15-remainder)
    );

  }


  /*
    Current configured hours:
    07:00 - 17:00
  */

  const opening =
    new Date();


  opening.setHours(
    7,0,0,0
  );


  const closing =
    new Date();


  closing.setHours(
    17,0,0,0
  );


  if(first<opening){

    first =
      new Date(opening);

  }


  let current =
    new Date(first);


  while(current<closing){

    const option =
      document.createElement(
        "option"
      );


    const h =
      String(
        current.getHours()
      ).padStart(2,"0");


    const m =
      String(
        current.getMinutes()
      ).padStart(2,"0");


    option.value =
      current.toISOString();


    option.textContent =
      h+":"+m;


    select.appendChild(
      option
    );


    current =
      new Date(
        current.getTime()
        +
        15*60*1000
      );

  }


  if(!select.options.length){

    const option =
      document.createElement(
        "option"
      );


    option.value="";

    option.textContent =
      TEXT[language].noTimes;


    select.appendChild(
      option
    );


    exactPickupDate=null;

  }else{

    exactPickupDate =
      new Date(
        select.value
      );

  }


  updatePickupInfo();
}


/* =====================================
   EXACT SELECT
===================================== */

function chooseExactTime(){

  const value =
    document.getElementById(
      "exactTime"
    ).value;


  exactPickupDate =
    value
      ? new Date(value)
      : null;


  updatePickupInfo();
}


/* =====================================
   PICKUP INFO
===================================== */

function updatePickupInfo(){

  const info =
    document.getElementById(
      "pickupInfo"
    );


  if(pickupMode==="asap"){

    info.innerText =
      TEXT[language].ready
      +" "
      +pickupMinutes
      +" "
      +TEXT[language].minutes;

    return;

  }


  if(!exactPickupDate){

    info.innerText =
      TEXT[language].noTimes;

    return;

  }


  const h =
    String(
      exactPickupDate.getHours()
    ).padStart(2,"0");


  const m =
    String(
      exactPickupDate.getMinutes()
    ).padStart(2,"0");


  info.innerText =
    TEXT[language].pickupAt
    +" "
    +h
    +":"
    +m;

}


/* =====================================
   PICKUP ISO
===================================== */

function pickupISO(){

  if(pickupMode==="exact"){

    if(!exactPickupDate)
      return null;


    return exactPickupDate
      .toISOString();

  }


  return new Date(
    Date.now()
    +
    pickupMinutes*60*1000
  ).toISOString();

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message "+type;


  box.innerText=text;


  box.style.display="block";


  box.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =====================================
   PLACE ORDER
===================================== */

async function placeOrder(){

  if(!cart.length){

    showMessage(
      TEXT[language].empty,
      "error"
    );

    return;

  }


  const pickup =
    pickupISO();


  if(!pickup){

    showMessage(
      TEXT[language].choosePickup,
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "orderButton"
    );


  button.disabled=true;

  button.innerText =
    TEXT[language].sending;


  try{

    const response =
      await fetch(
        "/api/order",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            /*
              VERY IMPORTANT:
              Telegram initData is still
              sent to app.py.
            */

            initData:
              tg.initData || "",

            pickup:
              pickup,

            items:
              cart

          })

        }
      );


    const raw =
      await response.text();


    let result={};


    try{

      result =
        raw
        ? JSON.parse(raw)
        : {};

    }catch(e){

      throw new Error(
        "Invalid server response."
      );

    }


    if(!response.ok){

      throw new Error(
        result.error
        ||
        "Order failed."
      );

    }


    cart=[];

    updateCart();


    showMessage(

      "✅ "
      +TEXT[language].success
      +"\n\n"
      +"#"
      +result.order_id
      +"\n"
      +TEXT[language].pickup
      +": "
      +result.pickup
      +"\n"
      +result.total
      +" RSD"
      +"\n\n"
      +TEXT[language].pay,

      "success"

    );


    try{

      tg.HapticFeedback
        .notificationOccurred(
          "success"
        );

    }catch(e){}


  }catch(error){

    showMessage(
      "❌ "+error.message,
      "error"
    );


    try{

      tg.HapticFeedback
        .notificationOccurred(
          "error"
        );

    }catch(e){}


  }finally{

    button.disabled=false;

    button.innerText =
      TEXT[language].order;

  }

}


/* =====================================
   START
===================================== */

loadMenu();

updateCart();

updatePickupInfo();
